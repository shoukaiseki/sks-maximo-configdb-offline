sks:
  # debug端口号
  debug-port: 5005
  # 子进程额外环境变量（可选）
  env:
    MXE_MASDEPLOYED: "1"
  # ConfigDB 额外命令行参数，默认已携带 -k -l -e -r
  configDBArgs:
    # - -k   # properties 目录（默认已添加）
    # - -l   # 输出日志文件（默认已添加）
    # - -e   # 执行 SQL（默认已添加）
    # - -r   # 之后执行 RestoreFromBackup（默认已添加）
    - -z     # 生成 db2text_configdb.bat/sh 脚本
  maximo-properties:
    default: local
    global:
      mxe.name: MXServer
      mxe.db.driver: com.ibm.db2.jcc.DB2Driver
      mxe.db.schemaowner: maximo
    environments:
      local:
        sks.desc: 本机
        mxe.db.url: jdbc:db2://localhost:50000/MAXIMO
        mxe.db.user: db2inst1
        mxe.db.password: Maximo123
        #mxe.security.crypto.key: "tXwBJJjEfGwsMpmLJTKfwPki"
        #mxe.security.old.crypto.key: "tXwBJJjEfGwsMpmLJTKfwPki"
        #mxe.security.cryptox.key: "WJlJEUDzAreXkkaGCTluiufM"
        #mxe.security.old.cryptox.key: "WJlJEUDzAreXkkaGCTluiufM"
  #验证全库密码是否正常
  validate-cryptokey:
    tableid-map:
      #定义表的主键,在成功/失败时显示该字段名称
      MAXUSER: "USERID"
      PERSON: "PERSONUID"
